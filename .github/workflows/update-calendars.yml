on: push

defaults:
  run:
    shell: bash
    working-directory: scripts

jobs:
  scrape-and-parse:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v3

    - uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Scrape and parse calendar
      run: |
        python parse.py

    - name: Check for modified files
      id: git-check
      run: echo ::set-output name=modified::$(if [ -n "$(git status --porcelain)" ]; then echo "true"; else echo "false"; fi)

    - name: Update changes in GitHub repository
      if: steps.git-check.outputs.modified == 'true'
      run:  |
        git config --global user.name 'Automatic Update'
        git config --global user.email '13189449+Neudrino@users.noreply.github.com'
        git add --all
        git commit -m '[Automation] update the calendars with Github actions'
        git push
